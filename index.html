<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나를 살리는 코디 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f1;--ink:#2d2733;--muted:#766c7d;--pink:#ff6b8b;--pink2:#ffe4ea;--violet:#7b61ff;--violet2:#ece8ff;--green:#1fa36a;--green2:#dff6ea;--line:#eadfe6;--card:#fff;--shadow:0 10px 30px rgba(120,80,110,.12)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff1f4 0%,#fff9ef 55%,#eef6ff 100%);min-height:100vh;line-height:1.6;font-size:16px}
button{font-family:inherit;color:inherit}
h1,h2,h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;margin:0}
h4{margin:0 0 8px;font-size:15px}
p{margin:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px}
.brand{font-family:'Jua',sans-serif;font-size:22px;color:var(--pink);background:none;border:0;cursor:pointer;padding:4px 6px}
#steps{display:flex;gap:6px;overflow-x:auto;padding:2px}
.step{white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.step.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.step.done{border-color:var(--pink);color:var(--pink)}
main{max-width:1120px;margin:0 auto;padding:6px 16px 60px}
.screen[hidden]{display:none}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:20px}
.stage{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.avcard{background:linear-gradient(180deg,#fff 0%,#fff0f4 100%);text-align:center;padding:14px}
.fit{height:min(70vh,600px);display:flex;justify-content:center}
.fit.sm{height:min(52vh,430px)}
.fit svg{height:100%;width:auto;aspect-ratio:300/580;max-width:100%}
.cap{font-size:13px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;background:var(--violet2);border-radius:14px;padding:10px 16px;font-size:15px;cursor:pointer;min-height:44px;font-weight:500}
.tab.on{background:var(--violet);color:#fff;font-weight:700}
.grp{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;cursor:pointer;transition:.12s}
.chip:hover:not(:disabled){border-color:var(--pink)}
.chip.on{border-color:var(--pink);background:var(--pink2);font-weight:700;box-shadow:0 0 0 3px rgba(255,107,139,.22)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d5cbd8;cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--pink),0 0 0 6px rgba(255,107,139,.25)}
.sw.star::after{content:"★";position:absolute;right:-5px;top:-9px;font-size:15px;color:#f5a623;text-shadow:0 0 2px #fff}
.sw-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;max-width:320px}
.note{background:#fff8dd;border-radius:16px;padding:12px 16px;font-size:15px}
.note.pink{background:var(--pink2)}
.note.green{background:var(--green2)}
.btn{min-height:50px;padding:10px 26px;border-radius:999px;border:0;background:var(--pink);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(255,107,139,.35)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.violet{background:var(--violet);box-shadow:0 6px 16px rgba(123,97,255,.3)}
.btn.sm{min-height:42px;font-size:15px;padding:8px 18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.15;color:var(--pink)}
.hero .msg{font-size:clamp(18px,2.6vw,24px);font-weight:700;margin:16px 0;background:linear-gradient(transparent 55%,#ffd9e2 55%);display:inline}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.s4{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.s4 b{display:block;color:var(--violet);font-family:'Jua',sans-serif;font-size:20px}
.s4 span{font-size:14px;color:var(--muted)}
.heroav{background:#fff;border-radius:30px;padding:10px;box-shadow:var(--shadow)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.goal{text-align:left;padding:16px;border-radius:20px;border:2px solid var(--line);background:#fff;cursor:pointer;min-height:92px;font-size:16px}
.goal.on{border-color:var(--violet);background:var(--violet2);box-shadow:0 0 0 3px rgba(123,97,255,.25)}
.goal b{display:block;font-size:17px}
.goal small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.cs{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;position:relative;min-height:74px}
.cs i{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cs.on{border-color:var(--pink);background:var(--pink2);font-weight:700}
.cs.onb{border-color:var(--violet);background:var(--violet2);font-weight:700}
.cs em{position:absolute;top:-8px;right:-4px;font-style:normal;background:var(--pink);color:#fff;border-radius:999px;font-size:10px;padding:0 6px}
.cs em.b{background:var(--violet)}
.dfit{background:linear-gradient(180deg,#fff,#fdeef3);border-radius:22px;padding:6px;text-align:center}
.dfit svg{width:100%;height:auto;max-height:360px}
.drow{display:grid;gap:12px}
.drow.two{grid-template-columns:1fr 1fr}
.imp{font-family:'Jua',sans-serif;font-size:20px;color:var(--violet);text-align:center;margin:8px 0 0}
.mrow{margin-bottom:12px;padding:8px 10px;border-radius:14px;border:2px solid transparent}
.mrow.tg{border-color:var(--violet);border-style:dashed;background:#faf9ff}
.mrow.ok{border-color:var(--green);background:var(--green2)}
.mtop{display:flex;justify-content:space-between;font-size:15px}
.mtop b{font-variant-numeric:tabular-nums}
.bar{position:relative;height:16px;background:#f1e9ee;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .35s}
.mrow.tg .bar i{background:var(--violet)}
.mrow.ok .bar i{background:var(--green)}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.28)}
.mnote{font-size:13px;margin-top:3px;color:var(--muted)}
.mrow.ok .mnote{color:#157a50;font-weight:700}
.effects ol{margin:6px 0 0;padding-left:22px}
.effects li{margin-bottom:4px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
textarea,input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;resize:vertical}
textarea:focus,input[type=text]:focus{outline:3px solid rgba(123,97,255,.3);border-color:var(--violet)}
.check{list-style:none;padding:0;margin:8px 0 0}
.check li{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.check .mk{width:26px;height:26px;border-radius:50%;background:#eee;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700;color:#fff}
.check li.ok .mk{background:var(--green)}
.codi-card{background:linear-gradient(160deg,#fff 0%,#fff2f6 100%);border:3px solid var(--pink2);border-radius:28px;padding:20px}
.cc-head small{color:var(--pink);font-weight:700}
.cc-head h3{font-size:34px}
.cc-body{display:grid;grid-template-columns:minmax(120px,.8fr) 1.2fr;gap:14px;margin-top:10px;align-items:start}
.cc-body .fit{height:min(54vh,430px)}
.pill{display:inline-block;background:var(--violet2);color:var(--violet);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;font-size:14px;font-weight:700}
.mini{display:grid;grid-template-columns:96px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin-bottom:5px}
.mini .bar{height:10px;margin:0}
.mini.ok .bar i{background:var(--green)}
.mini.tg .bar i{background:var(--violet)}
.cc-desc{margin-top:12px;background:#fff;border-radius:18px;padding:14px;white-space:pre-wrap;word-break:keep-all}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmprow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.cmprow .bar{height:11px;margin:2px 0}
.cmprow .bar.b i{background:var(--violet)}
.legend{display:flex;gap:12px;font-size:13px;flex-wrap:wrap;color:var(--muted);margin-bottom:6px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#2d2733;color:#fff;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center;font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:860px){
 .stage{grid-template-columns:1fr}
 .avcard{position:sticky;top:6px;z-index:10;padding:8px}
 .avcard .fit{height:36vh}
 .avcard .cap{display:none}
 .hero{grid-template-columns:1fr}
 .steps4{grid-template-columns:1fr 1fr}
 .cmpgrid .fit.sm{height:34vh}
 .cmprow{grid-template-columns:1fr}
 .cc-body{grid-template-columns:1fr 1.3fr}
}
@media(max-width:520px){.steps4{grid-template-columns:1fr}.card{padding:14px;border-radius:22px}.cc-body{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><button class="brand" data-act="go" data-v="start">나를 살리는 코디 랩</button><nav id="steps" aria-label="진행 단계"></nav></header>
<main>
 <section id="s-start" class="screen"></section>
 <section id="s-avatar" class="screen" hidden></section>
 <section id="s-drape" class="screen" hidden></section>
 <section id="s-goal" class="screen" hidden></section>
 <section id="s-coordi" class="screen" hidden></section>
 <section id="s-compare" class="screen" hidden></section>
 <section id="s-card" class="screen" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>이 도구는 JavaScript가 필요해요.</noscript>

<script>

const TOPS=[

 {id:'hstripe',name:'가로 줄무늬 티셔츠',neck:true},{id:'vstripe',name:'세로 줄무늬 티셔츠',neck:true},

 {id:'sweat',name:'오버핏 맨투맨',neck:true},{id:'crop',name:'크롭 상의',neck:true}

 {id:'jogger',name:'추리닝 바지'},{id:'shorts',name:'반바지'},{id:'aline',name:'A라인 치마'},{id:'hline',name:'H라인 치마'}

const SHOES=[{id:'sneakers',name:'운동화'},{id:'loafers',name:'로퍼'},{id:'sandals',name:'샌들'},{id:'boots',name:'부츠'}];
const NECKS=[{id:'round',name:'라운드넥'},{id:'v',name:'V넥'},{id:'turtle',name:'터틀넥'}];
const NAME_OF=(arr,id)=>(arr.find(x=>x.id===id)||{name:id}).name;
const LONGPANTS=['flare','skinny','straight','wide','jogger'];

const DRAPE_COLORS=[
 {id:'coral',n:'코랄',h:'#FF7F6E',g:'w',t:'생기 있고 따뜻한 인상'},
 {id:'apricot',n:'살구',h:'#FFB27A',g:'w',t:'부드럽고 포근한 인상'},
 {id:'orange',n:'오렌지',h:'#F28A2E',g:'w',t:'활기차고 밝은 인상'},
 {id:'mustard',n:'머스타드',h:'#E0A800',g:'w',t:'따뜻하고 개성 있는 인상'},
 {id:'red',n:'레드',h:'#D93A3A',g:'w',t:'선명하고 당당한 인상'},
 {id:'camel',n:'카멜',h:'#C48A4F',g:'w',t:'차분하고 안정적인 인상'},

 {id:'rose',n:'로즈핑크',h:'#E27FA8',g:'c',t:'화사하고 사랑스러운 인상'},

const GOALS=[

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(hex,amt){const [r,g,b]=hex2rgb(hex);const t=amt<0?0:255,p=Math.abs(amt);return rgb2hex(r+(t-r)*p,g+(t-g)*p,b+(t-b)*p);}
function hsl(hex){const [r,g,b]=hex2rgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;const d=mx-mn;
 if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
 return {h,s,l};}
function cinfo(hex){const {h,s,l}=hsl(hex);const neutral=s<.14;const dark=l<.32;const bright=l>.62;
 const warm=!neutral&&(h<70||h>=330);const cool=!neutral&&h>=160&&h<300;
 return {h,s,l,neutral,dark,bright,warm,cool,exp:(bright?1:0)-(dark?1:0)+(warm?1:0)-(cool?1:0)};}
function cdist(a,b){const x=hex2rgb(a),y=hex2rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);}
const sameHex=(a,b)=>a.toLowerCase()===b.toLowerCase();
function colorName(hex){const c=DRAPE_COLORS.find(x=>sameHex(x.h,hex))||BASIC.find(x=>sameHex(x.h,hex));return c?(c.n):'선택한 색';}

function dims(a){
 const sh={narrow:46,mid:56,wide:68}[a.shoulder];let ch,wa,hp;
 switch(a.body){
  case 'upper':ch=sh+4;wa=ch-6;hp=Math.max(30,sh-16);break;
  case 'lower':ch=sh-14;wa=ch-6;hp=ch+30;break;
  case 'curvy':ch=sh-6;wa=ch-20;hp=ch+16;break;
  default:ch=sh-6;wa=ch-2;hp=ch;
 }
 return {sh,ch,wa,hp};
}
function wAt(D,y){
 const P=[[160,D.sh],[215,D.ch],[292,D.wa],[332,D.hp],[700,D.hp]];
 if(y<=P[0][0])return P[0][1];
 for(let i=1;i<P.length;i++){if(y<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0]);}}
 return D.hp;
}
const pts=arr=>arr.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const sideY=hem=>{const ys=[168,215,252,292,332,380,430,470].filter(y=>y<hem-4);ys.push(hem);return ys;};
const edgeW=(D,y,ease,fl)=>wAt(D,y)+ease+(y>332?(y-332)*fl:0);
function torsoPath(D,hem,ease,fl=0){
 const ys=sideY(hem);
 const L=ys.map(y=>[150-edgeW(D,y,ease,fl),y]);
 const R=ys.map(y=>[150+edgeW(D,y,ease,fl),y]).reverse();
 return pts([[138,156],[150-D.sh-ease,164],...L,...R,[150+D.sh+ease,164],[162,156]]);
}
function panelPts(D,sd,hem,ease,fl){
 const ys=sideY(hem);
 const outer=ys.map(y=>[150+sd*edgeW(D,y,ease,fl),y]);
 return pts([[150+sd*13,157],[150+sd*(D.sh+ease),164],...outer,[150+sd*13,hem]]);
}

function meters(stx){
 const ef=effects(stx);const M={tall:50,upper:50,lower:50,slim:50,soft:40,active:40,neat:40,legs:0};
 ef.forEach(e=>{if(e.m==='legs'){M.legs+=e.d;M.tall+=e.d*.5;}else M[e.m]+=e.d;});
 ['tall','upper','lower','slim','soft','active','neat'].forEach(k=>M[k]=Math.max(0,Math.min(100,Math.round(M[k]))));
 return {M,ef};
}
function goalEval(stx,M){
 return stx.goals.map(id=>{
  let ok=false,ms=[];
  switch(id){
   case 'tall':ok=M.tall>=60;ms=['tall'];break;
   case 'legs':ok=M.legs>=10;ms=['tall'];break;
   case 'wide':ok=M.upper>=60;ms=['upper'];break;
   case 'narrow':ok=M.upper<=40;ms=['upper'];break;
   case 'balance':{const u=M.upper-50,l=M.lower-50,b=stx.avatar.body;ok=b==='upper'?(l-u>=8):b==='lower'?(u-l>=8):Math.abs(u-l)<=8;ms=['upper','lower'];break;}
   case 'slim':ok=M.slim>=60;ms=['slim'];break;
   case 'soft':ok=M.soft>=60;ms=['soft'];break;
   case 'active':ok=M.active>=60;ms=['active'];break;
   case 'neat':ok=M.neat>=60;ms=['neat'];break;
  }
  return {id,ok,ms};
 });
}
function goalScore(id,M,body){
 switch(id){
  case 'tall':return M.tall;case 'legs':return M.legs;case 'wide':return M.upper;case 'narrow':return -M.upper;
  case 'balance':{const u=M.upper-50,l=M.lower-50;return body==='upper'?(l-u):body==='lower'?(u-l):-Math.abs(u-l);}
  case 'slim':return M.slim;case 'soft':return M.soft;case 'active':return M.active;case 'neat':return M.neat;
 }
 return 0;
}
function wants(id){
 switch(id){
  case 'tall':return [['tall',1],['legs',1]];case 'legs':return [['legs',1]];
  case 'wide':return [['upper',1]];case 'narrow':return [['upper',-1]];
  case 'balance':return [['upper',0],['lower',0]];case 'slim':return [['slim',1]];
  case 'soft':return [['soft',1]];case 'active':return [['active',1]];case 'neat':return [['neat',1]];
 }
 return [];
}
function sentences(stx,ef){
 const W=[];stx.goals.forEach(g=>W.push(...wants(g)));
 const rel=e=>W.some(w=>w[0]===e.m&&(w[1]===0||Math.sign(e.d)===w[1]));
 const list=ef.filter(e=>e.t).map(e=>({t:e.t,s:(rel(e)?100:0)+Math.abs(e.d)})).sort((a,b)=>b.s-a.s);
 const out=[];list.forEach(x=>{if(!out.includes(x.t)&&out.length<3)out.push(x.t);});
 if(!out.length)out.push('색이나 무늬, 길이를 바꿔 보면 더 다양한 효과를 찾을 수 있어요.');
 return out;
}

 if(!stx.goals.length)h+=`<div class="note" style="margin-top:12px">연출 목표를 고르면 목표 쪽 미터가 초록색으로 강조돼요. (⑤ 연출 목표 단계에서 고를 수 있어요)</div>`;
 else{

function stxLegNote(M){return M.legs>0?`다리 길이 효과 +${Math.round(M.legs)}`:'';}
function balanceHint(b){

function rCompare(){
 const A=st.saved.A,B=st.saved.B;
 const mk=(label,snap)=>`<div class="card avcard"><h3 style="font-size:26px;color:var(--${label==='A안'?'pink':'violet'})">${label}</h3>${snap?`<div class="fit sm">${avatarSVG({avatar:st.avatar,outfit:snap})}</div><div class="row2" style="justify-content:center;margin-top:8px"><button type="button" class="btn ghost sm" data-act="load" data-v="${label[0]}">이 코디 불러오기</button></div>`:`<div class="fit sm" style="align-items:center"><p class="cap">아직 저장하지 않았어요.<br>코디하기에서 현재 코디를 저장해 보세요.</p></div>`}</div>`;
 let table='';
 if(A&&B){
  const ma=meters({avatar:st.avatar,outfit:A,goals:st.goals}).M,mb=meters({avatar:st.avatar,outfit:B,goals:st.goals}).M;
  const tgm=new Set();st.goals.forEach(id=>wants(id).forEach(w=>tgm.add(w[0]==='legs'?'tall':w[0])));
  table=METERS.map(([k,l])=>`<div class="cmprow"><span>${tgm.has(k)?'🎯 ':''}${l}</span><div><div class="bar"><i style="width:${ma[k]}%"></i></div><div class="bar b"><i style="width:${mb[k]}%"></i></div><small>A ${ma[k]} · B ${mb[k]}</small></div></div>`).join('');
  const lines=st.goals.map(id=>{const sa=goalScore(id,ma,st.avatar.body),sb=goalScore(id,mb,st.avatar.body);
   const r=sa>sb+2?'A안이 더 커요':sb>sa+2?'B안이 더 커요':'두 안이 비슷해요';return `<li>'${esc(GOAL_BY[id].name)}' 효과는 <b>${r}</b>.</li>`;}).join('');
  table=`<div class="card"><h3 style="font-size:24px;margin-bottom:8px">미터 비교 <span class="cap">(분홍 = A안, 보라 = B안)</span></h3>${table}${lines?`<div class="note green"><b>고른 목표로 비교해 보면</b><ul style="margin:6px 0 0;padding-left:20px">${lines}</ul></div>`:'<div class="note">연출 목표를 고르면 목표별로 어느 안이 더 가까운지도 알려 드려요.</div>'}</div>`;
 }else table=`<div class="note">A안과 B안을 모두 저장하면 두 코디의 미터를 나란히 비교할 수 있어요.</div>`;
 $('#s-compare').innerHTML=`<h2 style="font-size:30px;margin:6px 0 12px">5. 코디 비교하기</h2>
 <div class="card" style="margin-bottom:16px"><div class="row2"><button type="button" class="btn sm" data-act="save" data-v="A">지금 코디를 A안으로 저장</button><button type="button" class="btn violet sm" data-act="save" data-v="B">지금 코디를 B안으로 저장</button><button type="button" class="btn ghost sm" data-act="go" data-v="coordi">← 코디 더 바꾸러 가기</button></div></div>

const ELEMS=['선','색','무늬','재질','실루엣'];
function checkText(t){const len=[...t.replace(/\s/g,'')].length;const found=ELEMS.filter(w=>t.includes(w));return {len,found,okLen:len>=30,okEl:found.length>=2};}
function checklistHTML(){
 const c=checkText(st.desc);
 return `<ul class="check"><li class="${c.okLen?'ok':''}"><span class="mk">${c.okLen?'✓':''}</span><span>30자 이상 썼어요 <b>(${c.len}자)</b></span></li>
 <li class="${c.okEl?'ok':''}"><span class="mk">${c.okEl?'✓':''}</span><span>디자인 요소 낱말(선·색·무늬·재질·실루엣)을 2개 이상 썼어요 <b>(${c.found.length?c.found.join(', '):'아직 없어요'})</b></span></li></ul>
 <p class="cap" style="margin-top:6px">${c.okLen&&c.okEl?'멋져요! 목표와 디자인 요소가 잘 연결된 설명이에요.':'목표 → 디자인 요소 → 효과 순서로 써 보면 더 좋아져요.'}</p>`;
}
function cardHTML(){
 const {M}=meters(st);const ge=goalEval(st,M);const tg={};ge.forEach(r=>r.ms.forEach(m=>{tg[m]=tg[m]?tg[m]&&r.ok:r.ok;}));

  <h4>연출 목표</h4><div>${st.goals.length?st.goals.map(i=>`<span class="pill">${GOAL_BY[i].name}</span>`).join(''):'<span class="cap">고른 목표가 없어요</span>'}</div>
  <h4 style="margin-top:8px">효과 미터</h4>${mini}
  <h4 style="margin-top:8px">코디 구성</h4><p style="font-size:13px">상의 ${NAME_OF(TOPS,o.top)} · 하의 ${NAME_OF(BOTTOMS,o.bottom)}<br>겉옷 ${NAME_OF(OUTERS,o.outer)} · 신발 ${NAME_OF(SHOES,o.shoes)}</p></div></div>
 <div class="cc-desc"><h4>나의 코디 설명</h4>${esc(st.desc)||'<span class="cap">설명을 쓰면 여기에 나와요.</span>'}</div></div>`;
}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function wrapText(g,text,x,y,maxW,lh,maxLines){
 const lines=[];let cur='';
 for(const ch of text){if(ch==='\n'){lines.push(cur);cur='';continue;}if(g.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;}
 if(cur)lines.push(cur);
 const shown=lines.slice(0,maxLines);
 if(lines.length>maxLines)shown[maxLines-1]=shown[maxLines-1].replace(/.$/,'')+'…';
 shown.forEach((l,i)=>g.fillText(l,x,y+i*lh));
}
function svgToImg(svg){
 return new Promise((res,rej)=>{
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);
  const img=new Image();img.onload=()=>{res(img);setTimeout(()=>URL.revokeObjectURL(url),2000);};img.onerror=rej;img.src=url;
 });
}
async function savePNG(){
 try{await Promise.all([document.fonts.load('700 28px "Noto Sans KR"'),document.fonts.load('400 24px "Noto Sans KR"'),document.fonts.load('40px "Jua"')]);}catch(e){}
 const W=1080,H=1500;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const grd=g.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#ffe9ef');grd.addColorStop(1,'#fff6e8');g.fillStyle=grd;g.fillRect(0,0,W,H);
 g.fillStyle='#fff';rr(g,30,30,1020,1440,44);g.fill();
 g.fillStyle='#ff6b8b';g.font='700 26px "Noto Sans KR",sans-serif';g.textBaseline='alphabetic';g.fillText('나를 살리는 코디 랩',70,95);
 g.fillStyle='#2d2733';g.font='56px "Jua","Noto Sans KR",sans-serif';g.fillText(st.name||'나의 코디',70,165);
 g.fillStyle='#fff1f5';rr(g,60,200,420,810,30);g.fill();
 const img=await svgToImg(avatarSVG(st,'px',[300,580]));
 g.drawImage(img,70,214,406,785);
 const {M}=meters(st);const ge=goalEval(st,M);const tg={};ge.forEach(r=>r.ms.forEach(m=>{tg[m]=(m in tg)?tg[m]&&r.ok:r.ok;}));
 let y=240;g.fillStyle='#7b61ff';g.font='700 26px "Noto Sans KR",sans-serif';g.fillText('연출 목표',520,y);y+=14;
 g.font='700 24px "Noto Sans KR",sans-serif';
 if(!st.goals.length){g.fillStyle='#766c7d';g.font='400 22px "Noto Sans KR",sans-serif';g.fillText('고른 목표가 없어요',520,y+34);y+=56;}
 st.goals.forEach(id=>{const t=GOAL_BY[id].name;const w=g.measureText(t).width+40;g.fillStyle='#ece8ff';rr(g,520,y+8,w,44,22);g.fill();g.fillStyle='#7b61ff';g.fillText(t,540,y+39);y+=58;});
 y=Math.max(y+20,400);g.fillStyle='#7b61ff';g.font='700 26px "Noto Sans KR",sans-serif';g.fillText('효과 미터',520,y);y+=22;
 METERS.forEach(([k,l,b])=>{
  g.fillStyle='#2d2733';g.font='400 22px "Noto Sans KR",sans-serif';g.fillText(l,520,y+22);
  const d=Math.round(M[k]-b);g.textAlign='right';g.font='700 22px "Noto Sans KR",sans-serif';g.fillText((d>0?'+':d<0?'−':'')+Math.abs(d),1010,y+22);g.textAlign='left';
  g.fillStyle='#f1e9ee';rr(g,520,y+30,490,14,7);g.fill();
  g.fillStyle=(k in tg)?(tg[k]?'#1fa36a':'#7b61ff'):'#ff6b8b';if(M[k]>0){rr(g,520,y+30,Math.max(14,490*M[k]/100),14,7);g.fill();}
  g.fillStyle='rgba(0,0,0,.3)';g.fillRect(520+490*b/100-1,y+28,2,18);
  y+=64;
 });
 const o=st.outfit;g.fillStyle='#7b61ff';g.font='700 26px "Noto Sans KR",sans-serif';g.fillText('코디 구성',520,y+14);
 g.fillStyle='#2d2733';g.font='400 22px "Noto Sans KR",sans-serif';
 g.fillText(`상의 ${NAME_OF(TOPS,o.top)} · 하의 ${NAME_OF(BOTTOMS,o.bottom)}`,520,y+52);
 g.fillText(`겉옷 ${NAME_OF(OUTERS,o.outer)} · 신발 ${NAME_OF(SHOES,o.shoes)}`,520,y+86);
 g.fillStyle='#fff8f2';rr(g,60,1040,960,390,28);g.fill();
 g.fillStyle='#ff6b8b';g.font='700 26px "Noto Sans KR",sans-serif';g.fillText('나의 코디 설명',90,1090);
 g.fillStyle='#2d2733';g.font='400 28px "Noto Sans KR",sans-serif';
 wrapText(g,st.desc||'(설명을 쓰면 이곳에 나와요)',90,1142,900,44,7);
 c.toBlob(b=>{if(!b){toast('이미지를 만들지 못했어요. 다시 시도해 주세요.');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(st.name||'나의_코디')+'_코디카드.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('코디 카드를 저장했어요!');},'image/png');
}

/* ================= 렌더/이벤트 ================= */
const RENDERERS={start:rStart,avatar:rAvatar,drape:rDrape,goal:rGoal,coordi:rCoordi,compare:rCompare,card:rCard};
function render(){
 document.querySelectorAll('.screen').forEach(e=>{e.hidden=e.id!=='s-'+screen;});
 renderSteps();RENDERERS[screen]();
}
function go(s){screen=s;render();window.scrollTo(0,0);}
function setPath(k,v){const p=k.split('.');let o=st;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;}
function toggleGoal(id){
 const i=st.goals.indexOf(id);
 if(i>=0)st.goals.splice(i,1);
 else{
  if(st.goals.length>=2){toast('목표는 2개까지 고를 수 있어요. 하나를 눌러 해제하면 다른 목표를 고를 수 있어요.');return;}
  const cf=CONFLICT[id];if(cf&&st.goals.includes(cf)){toast('두 목표는 서로 반대 방향이라 함께 고를 수 없어요. 하나만 골라 볼까요?');return;}
  st.goals.push(id);
 }
 render();
}
function pickDrape(id){
 if(drape.cmp)drape[drape.side]=id;else drape.a=id;
 render();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const act=b.dataset.act,v=b.dataset.v;
 switch(act){
  case 'go':go(v);break;
  case 'set':setPath(b.dataset.k,b.dataset.num!==undefined?Number(v):v);render();break;
  case 'tab':tabs[b.dataset.k]=v;render();break;
  case 'goal':toggleGoal(v);break;
  case 'drape':pickDrape(v);break;
  case 'cmpToggle':drape.cmp=!drape.cmp;if(drape.cmp&&drape.a===drape.b)drape.b=drape.a==='sky'?'coral':'sky';drape.side='a';render();break;
  case 'side':drape.side=v;render();break;
  case 'saveColor':{
   const id=curDrapeId(),i=st.myColors.indexOf(id);
   if(i>=0){st.myColors.splice(i,1);}
   else if(st.myColors.length>=3){toast('나의 색은 3개까지예요. 하나를 빼고 다른 색을 담아 보세요.');return;}
   else{st.myColors.push(id);toast(DC(id).n+' 색을 나의 색에 담았어요!');}
   render();break;}
  case 'rmColor':st.myColors=st.myColors.filter(x=>x!==v);render();break;
  case 'save':st.saved[v]={...st.outfit};toast(v+'안을 저장했어요!');render();break;
  case 'load':if(st.saved[v]){st.outfit={...st.saved[v]};toast(v+'안을 불러왔어요. 코디하기에서 이어서 바꿀 수 있어요.');go('coordi');}break;
  case 'png':savePNG();break;
  case 'reset':if(confirm('모든 선택이 지워지고 처음 화면으로 돌아가요. 괜찮을까요?')){st=initial();tabs={avatar:'face',coordi:'top'};drape={a:'coral',b:'sky',cmp:false,side:'a'};go('start');}break;
 }
});
render();
